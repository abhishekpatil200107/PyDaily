<title>PyDaily - Python Notes Tracker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e3e6ef;--pri:#3b6cf6;--pri-ink:#fff;--ok:#1f9d63;--warn:#e08a00;--bad:#d64545;--soft:#eef2ff}
body.dark{--bg:#12151d;--card:#1b2030;--ink:#e8ecf6;--mute:#98a2b8;--line:#2b3247;--pri:#6d93ff;--pri-ink:#0d1220;--ok:#43c88a;--warn:#f0a93b;--bad:#ff7a7a;--soft:#232b44}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
#menu{display:none}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 54px)}
aside{border-right:1px solid var(--line);background:var(--card);padding:12px;overflow:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
aside input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.nav button{width:100%;text-align:left;margin-bottom:4px}
.item{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--soft)}
.item.cur{background:var(--soft);outline:1px solid var(--pri)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.understood{background:var(--ok)}.dot.again{background:var(--warn)}
.item small{margin-left:auto;color:var(--mute)}
main{padding:20px;max-width:900px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
h2{margin:0 0 6px;font-size:22px}h3{margin:0 0 8px;font-size:16px}
.mute{color:var(--mute)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--ink)}
.badge.understood{background:var(--ok);color:#fff}.badge.again{background:var(--warn);color:#fff}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
textarea{width:100%;min-height:160px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
input[type=time],input[type=number]{padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
ul.pts{padding-left:18px;margin:6px 0}ul.pts li{margin:4px 0}
.stars{font-size:28px;color:var(--warn);letter-spacing:2px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px;text-align:center}
.stat b{font-size:26px;display:block}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:20px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;background:var(--soft)}
.rec{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 aside{display:none;position:fixed;top:54px;left:0;bottom:0;width:85%;max-width:320px;z-index:6;max-height:none}
 aside.open{display:block}
 #menu{display:inline-block}
 main{padding:12px}
}
.cb code:focus{outline:1px dashed var(--pri)}.cb .row{margin:-4px 0 8px}.out{white-space:pre-wrap;border-color:var(--ok)}.out.err{border-color:var(--bad);color:var(--bad)}
.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;gap:3px;overflow:auto;padding-bottom:4px}.hc{width:14px;height:14px;border-radius:3px;background:var(--line)}.hc.h1{background:var(--ok);opacity:.55}.hc.h2{background:var(--ok)}.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri);color:var(--pri-ink)}
pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:6px 0 12px;font:13px/1.5 ui-monospace,Consolas,monospace}
h4{margin:16px 0 4px;font-size:15px;color:var(--pri)}
.grp{margin:12px 6px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

body{font-size:15.5px;letter-spacing:.005em}
header{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:0 1px 10px rgba(20,30,60,.06)}
header h1{background:linear-gradient(90deg,var(--pri),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.04);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 4px 22px rgba(59,108,246,.12)}
button,.btn{border-radius:10px;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s}
button:active,.btn:active{transform:scale(.97)}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.pri{background:linear-gradient(135deg,var(--pri),#7c5cf6);border:0;box-shadow:0 3px 10px rgba(59,108,246,.3)}
.tabs button{border-radius:99px;padding:7px 14px}
.grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:14px 6px 4px;font-weight:700}
.item{transition:background .15s,transform .15s}.item:hover{transform:translateX(2px)}
.bar{height:10px;border-radius:99px;overflow:hidden}.bar i{border-radius:99px;transition:width .5s}
.stat{border-radius:14px;transition:transform .2s}.stat:hover{transform:translateY(-2px)}
pre{border-radius:12px;font-size:13.5px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
main{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:760px){main{padding:12px}.card{padding:13px}h2{font-size:19px}}
@media print{header,aside,.tabs,button{display:none!important}.layout{display:block}}

/* ===== Stylish theme v3 ===== */
:root{--bg:#f3f4ff;--card:#fff;--ink:#1a1f36;--mute:#6a7391;--line:#e5e7f6;--pri:#6366f1;--soft:#eef0ff;--grad:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899)}
body.dark{--bg:#0a0e1d;--card:#131a2e;--ink:#e9ecfa;--mute:#98a2c3;--line:#262f4d;--pri:#818cf8;--soft:#1a2240;--pri-ink:#0b1020}
body{background:radial-gradient(900px 500px at 10% -10%,rgba(99,102,241,.14),transparent),radial-gradient(800px 500px at 100% 0,rgba(236,72,153,.10),transparent),var(--bg);background-attachment:fixed}
header{border-bottom:0}header h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px}
aside{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(12px)}
aside input{border-radius:99px;padding:10px 16px;background:var(--soft);border-color:transparent}
.nav button{border-radius:12px;background:var(--soft);border-color:transparent;font-weight:600}
.item{border-left:3px solid transparent;border-radius:10px}
.item.cur{background:linear-gradient(90deg,color-mix(in srgb,var(--pri) 20%,transparent),transparent);outline:0;border-left-color:var(--pri)}
.dot{width:11px;height:11px}.dot.understood{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent)}.dot.again{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 28%,transparent)}
.grp{color:var(--pri);margin-top:16px}
.card{border-color:color-mix(in srgb,var(--line) 70%,transparent)}
button.pri,.tabs button.on{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 16px rgba(99,102,241,.32)}
.tabs{background:var(--soft);padding:5px;border-radius:99px;display:inline-flex;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:16px}.stat b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:30px}
.bar>i{background:var(--grad)}
.badge{padding:3px 11px;font-weight:600}
h4{display:inline-block;background:var(--soft);padding:2px 10px;border-radius:8px}
pre{background:#0f172a;color:#e2e8f0;border:1px solid #1e293b;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.out{color:#86efac}.out.err{color:#fca5a5}
.flash{border:0;background:var(--grad);color:#fff;font-weight:600;box-shadow:0 12px 30px rgba(99,102,241,.3);transition:transform .2s}.flash:hover{transform:scale(1.015)}
textarea,input[type=time],input[type=number]{border-radius:12px;background:var(--soft);border-color:transparent}
textarea:focus{background:var(--card)}
.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:26px;border-radius:24px;color:#fff;background:var(--grad);box-shadow:0 16px 44px rgba(99,102,241,.38);margin-bottom:16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:after{content:"";position:absolute;left:30%;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.hl,.ring{position:relative;z-index:1}.hero h2{font-size:27px;margin:2px 0 6px}.hero p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px;font-size:13px;backdrop-filter:blur(6px)}
.cta{background:#fff;color:#4f46e5;border:0;font-weight:700;padding:11px 20px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.2)}.cta:hover{transform:translateY(-1px)}
.ring{--p:0;width:124px;height:124px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;background:radial-gradient(closest-side,#3b2f9a 79%,transparent 81%),conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0)}
.ring b{font-size:27px;display:block}.ring small{font-size:11px;opacity:.85}
main>*{animation:up .45s both}main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(n+5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#bn{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:8;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(20,20,60,.22);padding:6px;gap:4px}
#bn button{flex:1;border:0;background:transparent;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;border-radius:16px}#bn button span{font-size:19px}
@media(max-width:800px){#bn{display:flex}main{padding-bottom:96px}#toast{bottom:90px}aside{top:54px;bottom:0;padding-bottom:90px}}
@media(max-width:560px){.hero{flex-direction:column-reverse;align-items:flex-start;padding:20px}.ring{align-self:flex-end;width:100px;height:100px}.hero h2{font-size:22px}}

/* ===== Modern theme v4 ===== */
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3,.hero h2,.stat b,.ring b{font-family:Poppins,Inter,system-ui,sans-serif}
pre,code,.sp-code{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.ic{width:19px;height:19px;flex:none}.lg{width:30px;height:30px}
header h1{display:flex;align-items:center;gap:9px;margin:0}
.rankpill{margin-left:auto;background:var(--grad);color:#fff;padding:5px 13px;border-radius:99px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(99,102,241,.4);white-space:nowrap}
button,.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--soft);color:var(--ink);padding:9px 17px;border-radius:13px;font-weight:600;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 3px rgba(30,30,90,.12);transition:transform .15s,box-shadow .2s,filter .2s}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.25);filter:brightness(1.04)}
button.ok{background:linear-gradient(135deg,#10b981,#22c55e);color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.35)}
button.warn{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;box-shadow:0 6px 16px rgba(245,158,11,.35)}
button.bad{background:linear-gradient(135deg,#ef4444,#f43f5e);color:#fff;box-shadow:0 6px 16px rgba(239,68,68,.35)}
button.pri:hover{box-shadow:0 10px 26px rgba(99,102,241,.5)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.nav button{justify-content:flex-start;padding:11px 14px}
.grp::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--grad);margin-right:8px}
.item{padding:9px 10px}.item:hover{background:var(--soft)}
#bn button{box-shadow:none;border-radius:16px}#bn button:hover{transform:none;box-shadow:none;background:var(--soft)}
@media(min-width:801px){.layout{grid-template-columns:330px 1fr;padding:14px;gap:16px}aside{border:1px solid var(--line);border-radius:26px;top:70px;max-height:calc(100vh - 86px);box-shadow:0 14px 40px rgba(30,30,90,.1)}}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-content:center;text-align:center;color:#fff;background:radial-gradient(700px 480px at 50% 38%,#4338ca,#0b1020 72%);transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-logo{width:118px;height:118px;margin:0 auto 14px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,fl 3s ease-in-out .9s infinite;filter:drop-shadow(0 12px 34px rgba(99,102,241,.8))}
@keyframes pop{from{transform:scale(0) rotate(-140deg);opacity:0}to{transform:none;opacity:1}}@keyframes fl{50%{transform:translateY(-9px)}}
.sp-t{font:800 42px Poppins,system-ui;letter-spacing:.02em;background:linear-gradient(90deg,#fff,#c7d2fe,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s .5s both}
.sp-s{opacity:.9;margin-top:6px;animation:up .7s .8s both}.sp-s b{color:#fde68a}
.sp-code{font-size:14px;margin:20px auto 0;color:#86efac;overflow:hidden;white-space:nowrap;width:0;border-right:2px solid #86efac;animation:ty 1.2s steps(19) 1s forwards,bl .6s step-end infinite}
@keyframes ty{to{width:19ch}}@keyframes bl{50%{border-color:transparent}}
.sp-bar{width:210px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:20px auto 0;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fde68a,#f472b6);animation:ld 2.3s ease-out forwards}@keyframes ld{to{width:100%}}
.rk{background:rgba(255,255,255,.95)!important;color:#4f46e5;font-weight:700}
#inst{padding:7px 14px;font-size:13px;white-space:nowrap;border-radius:99px;flex:none}
header{gap:8px;flex-wrap:nowrap}header h1{flex:none;font-size:19px}.rankpill{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){.rankpill{padding:4px 9px;font-size:11px}#inst{padding:6px 11px;font-size:12px}header h1{font-size:17px}.lg{width:26px;height:26px}}
</style>

["Node and list","",r`class Node:
    def __init__(self, data):
        self.data = data
        self.next = None

class LinkedList:
    def __init__(self):
        self.head = None

    def add_front(self, data):
        n = Node(data)
        n.next = self.head
        self.head = n

    def add_end(self, data):
        n = Node(data)
        if not self.head:
            self.head = n
            return

            cur = cur.next

                else:

                return
            prev, cur = cur, cur.next

/* ---------- Study logic ---------- */
function isDue(id){const t=ts(id);const h=t.history;return t.status==='again'||(h.length&&h[h.length-1].score<60)||(t.status==='understood'&&t.due&&t.due<=today())}
function plan(){
  const due=T.filter(x=>isDue(x.id));
  const fresh=T.filter(x=>ts(x.id).status==='new').slice(0,Math.max(0,S.settings.goal-0));
  return{due,fresh};
}
function mark(id,ok){
  const t=ts(id);t.last=today();S.log[today()]=true;
  if(ok){t.status='understood';t.level=Math.min(t.level+1,INT.length);t.due=addDays(INT[t.level-1]);toast('Great! Next review in '+INT[t.level-1]+' day(s).')}
  else{t.status='again';t.level=0;t.due=today();toast('Okay, it stays in your daily list until you understand it.')}
  save();render();
}
function streak(){let n=0,d=new Date();if(!S.log[dstr(d)])d.setDate(d.getDate()-1);while(S.log[dstr(d)]){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- Scoring voice / typed explanation against notes ---------- */
const STOP=new Set('that this with from have will your they them then than into when what which where while also only each such been being does done just like make made more most some very the and for are but not you all can its was were has had how use used using uses lets let'.split(' '));
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function evaluate(id,text){
  const topic=BYID[id],toks=norm(text).split(' ').filter(Boolean),set=new Set(toks);
  const hit=w=>w.length<=4?set.has(w):toks.some(t=>t.startsWith(w.slice(0,w.length-2)));
  const rows=topic.p.map(([term,def])=>{
    const tw=norm(term).split(' ');
    const termHit=tw.every(hit);
    const sig=[...new Set(norm(def).split(' ').filter(w=>w.length>3&&!STOP.has(w)))];
    const ratio=sig.length?sig.filter(hit).length/sig.length:0;
    const sc=(termHit?0.5:0)+0.5*Math.min(1,ratio/0.45);
    return{term,def,termHit,sc};
  });
  let score=rows.reduce((a,r)=>a+r.sc,0)/rows.length*100;
  const t=ts(id);
  if(t.custom&&t.custom.trim().length>30){
    const ct=[...new Set(norm(t.custom).split(' ').filter(w=>w.length>4&&!STOP.has(w)))];
    if(ct.length){const r=ct.filter(hit).length/ct.length;score=score*0.75+Math.min(1,r/0.35)*100*0.25}
  }
  if(toks.length<20)score*=0.6+0.4*toks.length/20;
  score=Math.round(Math.max(0,Math.min(100,score)));
  const stars=score>=80?5:score>=60?4:score>=40?3:score>=20?2:1;
  return{score,stars,words:toks.length,got:rows.filter(r=>r.sc>=0.6),part:rows.filter(r=>r.sc>=0.3&&r.sc<0.6),miss:rows.filter(r=>r.sc<0.3)};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startMic(){
  if(!SR)return;
  recog=new SR();recog.lang='en-IN';recog.continuous=true;recog.interimResults=true;
  const base=transcript?transcript.trim()+' ':'';let fin='';
  recog.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else tmp+=r[0].transcript}
    transcript=base+fin+tmp;const ta=$('#tr');if(ta)ta.value=transcript};
  recog.onerror=e=>{toast('Mic problem: '+e.error+(e.error==='not-allowed'?' (allow microphone access)':''));listening=false;render()};
  recog.onend=()=>{if(listening){try{recog.start()}catch(e){}}};
  listening=true;try{recog.start()}catch(e){}render();
}
function stopMic(){listening=false;try{recog&&recog.stop()}catch(e){}render()}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='menu'){$('#side').classList.toggle('open');return}
  if(a==='star'){const t=ts(cur);t.star=!t.star;save();render();return}
  if(a==='tag'){const t=ts(cur);t.tag=!t.tag?'interview':t.tag==='interview'?'exam':'';save();render();return}
  if(a==='pomo'){if(pomo){logMin(Math.floor((Date.now()-pomo.start)/60000));pomo=null}else pomo={start:Date.now(),end:Date.now()+25*60000};render();return}
  if(a==='proj'){S.proj[el.dataset.k]=el.checked;save();return}
  if(a==='cheat'){cheat(+el.dataset.g);return}
  if(a==='qstart'){qz={id:cur,qs:mkQuiz(BYID[cur]),i:0,s:0,p:null};if(qz.qs.length<2){qz=null;toast('Not enough key points for a quiz')}render();return}
  if(a==='qpick'){if(!qz||qz.p!=null)return;qz.p=el.dataset.o;if(qz.p===qz.qs[qz.i].a)qz.s++;render();return}
  if(a==='qnext'){qz.i++;qz.p=null;if(qz.i>=qz.qs.length){const pc=Math.round(qz.s/qz.qs.length*100);ts(cur).history.push({d:today(),score:pc,stars:Math.round(pc/20)});S.log[today()]=true;save()}render();return}
  if(a==='copy'){const c=el.closest('.cb').querySelector('code').textContent;try{await navigator.clipboard.writeText(c);toast('Copied')}catch(x){toast('Copy not allowed here')}return}
  if(a==='run'){const box=el.closest('.cb'),out=box.querySelector('.out'),code=box.querySelector('code').textContent;out.hidden=false;out.className='out';out.textContent='Running...';
    try{const py=await getPy();let buf='';py.setStdout({batched:t=>buf+=t+'\n'});py.setStderr({batched:t=>buf+=t+'\n'});
      const v=await py.runPythonAsync(code);if(v!==undefined&&v!==null)buf+=String(v);out.textContent=buf||'(no output)'}
    catch(x){out.className='out err';out.textContent=String(x.message||x).split('\n').slice(-6).join('\n')}return}
  if(a==='dark'){S.settings.dark=!S.settings.dark;save();render();return}
  if(a==='view'){view=el.dataset.v;$('#side').classList.remove('open');if(listening)stopMic();render();return}
  if(a==='open'){if(listening)stopMic();view='topic';cur=el.dataset.id;tab='notes';lastResult=null;transcript='';$('#side').classList.remove('open');render();scrollTo(0,0);return}
  if(a==='tab'){if(listening)stopMic();tab=el.dataset.t;render();return}
  if(a==='mark'){mark(cur,el.dataset.ok==='1');return}
  if(a==='speak'){const x=BYID[cur];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.t+'. '+x.s+' '+x.p.map(p=>p[0]+': '+p[1]).join('. '));u.lang='en-IN';speechSynthesis.speak(u);return}
  if(a==='mic'){listening?stopMic():startMic();return}
  if(a==='clear'){transcript='';lastResult=null;render();return}
  if(a==='check'){
    if(listening)stopMic();
    if(norm(transcript).length<5){toast('Explain the topic first (speak or type).');return}
    lastResult=evaluate(cur,transcript);const t=ts(cur);t.history.push({d:today(),score:lastResult.score,stars:lastResult.stars});S.log[today()]=true;save();render();return}
  if(a==='fflip'){fc.flip=!fc.flip;drawCard();return}
  if(a==='fnext'){fc.i=(fc.i+1)%fc.order.length;fc.flip=false;drawCard();return}
  if(a==='fprev'){fc.i=(fc.i-1+fc.order.length)%fc.order.length;fc.flip=false;drawCard();return}
  if(a==='fshuf'){fc.order.sort(()=>Math.random()-.5);fc.i=0;fc.flip=false;drawCard();return}
  if(a==='saveset'){
    S.settings.time=$('#rtime').value||'08:00';S.settings.goal=Math.max(0,Math.min(10,+$('#goal').value||0));S.settings.remind=$('#remind').checked;S.settings.lastNotified='';
    if(S.settings.remind&&'Notification' in window&&Notification.permission==='default'){await Notification.requestPermission()}
    save();toast('Saved'+(S.settings.remind&&'Notification' in window&&Notification.permission==='denied'?' (notifications are blocked in browser settings)':''));render();return}
  if(a==='ics'){S.settings.time=$('#rtime').value||S.settings.time;save();makeIcs();return}
  if(a==='export'){download('pydaily-backup.json',JSON.stringify(S,null,1),'application/json');return}
  if(a==='reset'){if(confirm('Delete all progress and notes?')){S=JSON.parse(JSON.stringify(DEF));save();render()}return}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;
  if(f==='transcript'){transcript=e.target.value;return}
  if(f==='pad'||f==='custom'){ts(cur)[f]=e.target.value;save()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S={proj:d.proj||{},study:d.study||{},topics:d.topics||{},settings:Object.assign({},DEF.settings,d.settings),log:d.log||{}};save();render();toast('Imported')}catch(x){toast('Not a valid backup file')}};r.readAsText(e.target.files[0])}
});
$('#q').addEventListener('input',renderList);

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;location.reload()}})}
let instEv=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;if(!$('#inst')){const b=document.createElement('button');b.id='inst';b.className='pri';b.textContent='Install app';b.onclick=async()=>{instEv.prompt();await instEv.userChoice;instEv=null;b.remove()};{const h=document.querySelector('header');h.insertBefore(b,h.lastElementChild)}}});
window.addEventListener('appinstalled',()=>{const b=$('#inst');if(b)b.remove()});
setInterval(checkReminder,30000);
render();checkReminder();
</script>
</body>
</html>
